<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shorts Blocker</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <main class="popup">
      <header class="popup__header">
        <img class="popup__icon" src="./assets/icon-128.png" alt="" />
        <div>
          <h1>Shorts Blocker</h1>
          <p id="status-text">상태를 불러오는 중...</p>
          <p id="identity-text">로그인되지 않음.</p>
        </div>
      </header>

      <section class="popup__details">
        <p>Worker API</p>
        <p id="worker-url-text"></p>
        <p>Group ID</p>
        <p id="group-id-text"></p>
        <p>동작 방식</p>
        <p>열려 있는 동안 자동 로그인, 자동 동기화, 자동 차단 상태 반영을 수행합니다.</p>
      </section>
    </main>

    <script src="./dist/apps/extension/src/popup.js"></script>
  </body>
</html>
