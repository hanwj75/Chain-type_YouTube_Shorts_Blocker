<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shorts Blocker</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <main class="popup">
      <header class="popup__header">
        <img class="popup__icon" src="./assets/icon-128.png" alt="" />
        <div>
          <h1>Shorts Blocker</h1>
          <p id="status-text">Loading state...</p>
          <p id="identity-text">Not signed in.</p>
        </div>
      </header>

      <form id="settings-form" class="popup__form">
        <p id="worker-url-text"></p>

        <label>
          Group ID
          <input id="group-id" name="groupId" type="text" placeholder="Discord 로그인 후 자동 입력" required />
        </label>

        <div class="popup__actions">
          <button type="submit">Save</button>
          <button id="sync-button" type="button">Sync Now</button>
        </div>
      </form>

      <div class="popup__actions">
        <button id="login-button" type="button">Discord Login</button>
        <button id="poll-button" type="button">Check Login</button>
      </div>

      <div class="popup__actions">
        <button id="logout-button" type="button">Logout</button>
      </div>
    </main>

    <script type="module" src="./dist/apps/extension/src/popup.js"></script>
  </body>
</html>
